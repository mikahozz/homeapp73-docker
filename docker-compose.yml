services:
  electricity:
    image: electricity
    container_name: electricity
    restart: unless-stopped
    build:
      context: ./electricity
      dockerfile: ./Dockerfile
    ports:
      - 3016:3016
  sofar:
    image: sofar
    restart: unless-stopped
    #        volumes:
    #            - ./src:/usr/src/app
    build:
      context: ./sofar_lsw3
      dockerfile: ./Dockerfile
  nordpoolrust:
    image: nordpoolrust
    container_name: nordpoolrust
    restart: unless-stopped
    build:
      context: ./nordpoolrust
      dockerfile: ./Dockerfile
    ports:
      - 3014:3014
  cabinbookings:
    image: cabinbookings
    container_name: cabinbookings
    restart: unless-stopped
    volumes:
      - ./cabinbookings/app.js:/usr/src/app/app.js
    build:
      context: ./cabinbookings
      dockerfile: ./Dockerfile
    ports:
      - 3011:3011
  cabinbookings-refresh:
    image: cabinbookings-refresh
    container_name: cabinbookings-refresh
    restart: "no"
    volumes:
      - ./cabinbookings-refresh/data:/usr/src/app/data
      - ./cabinbookings-refresh/util.js:/usr/src/app/util.js
    build:
      context: ./cabinbookings-refresh
      dockerfile: ./Dockerfile
  mariadb:
    image: mariadb:10.11
    container_name: mariadb
    env_file:
      - ./mariadb/docker.env
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Helsinki
    volumes:
        - mariadb-data:/config
    restart: unless-stopped
  # nginx:
  #   container_name: nginx
  #   image: nginx
  #   restart: always
  #   ports:
  #     - 80:80
  #   volumes:
  #     - ./nginx/nginx.conf:/etc/nginx/nginx.conf
  climateapi:
    container_name: climateapi
    image: climateapi
    restart: always
    build:
      context: ./climateapi
      dockerfile: ./Dockerfile
    volumes:
      - ./climateapi:/app
    ports:
      - 5011:5011
  # homeapp73:
  #   container_name: homeapp73
  #   image: homeapp73
  #   restart: unless-stopped
  #   build:
  #     context: ./homeclient
  #     dockerfile: ./Dockerfile
  #   ports:
  #     - 3000:3000
  #airflow:
  #    image: airflow
  #    restart: always
  #    ports:
  #    - "8080:8080"
  #    volumes:
  #    - ./airflow/dags:/usr/local/airflow/dags
  #    build:
  #        context: ./airflow
  #        dockerfile: ./Dockerfile

  mosquitto:
    container_name: mosquitto
    image: mosquitto
    build:
      context: ./mosquitto
      dockerfile: ./Dockerfile
    restart: always
    #        volumes:
    #            - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf
    ports:
      - "1883:1883"

  mqttclient:
    container_name: mqttclient
    image: mqttclient
    restart: always
    volumes:
      - ./mqttclient:/usr/src/app
    build:
      context: ./mqttclient
      dockerfile: ./Dockerfile
  influxdb:
    image: influxdb:1.8.10
    container_name: influxdb
    restart: always
    ports:
      - 8086:8086
    volumes:
      - influxdb-data:/var/lib/influxdb
    environment:
      - INFLUXDB_HTTP_FLUX_ENABLED=true
  zigbee2mqtt:
    container_name: zigbee2mqtt
    image: koenkk/zigbee2mqtt:2.11.0
    volumes:
      - ./zigbee2mqtt:/app/data
      - /run/udev:/run/udev:ro
    devices:
      - /dev/ttyACM0:/dev/ttyACM0
    restart: always
    network_mode: host
    privileged: true
    environment:
      - TZ=Europe/Helsinki
  # prometheus:
  #   container_name: prometheus
  #   image: prom/prometheus:v3.5.1
  #   restart: always
  #   ports:
  #     - 9090:9090
  #   volumes:
  #     - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
  #     - ./prometheus/data:/prometheus
  #   command:
  #     - "--config.file=/etc/prometheus/prometheus.yml"
  #     - "--storage.tsdb.path=/prometheus"
  #     - "--web.console.libraries=/etc/prometheus/console_libraries"
  #     - "--web.console.templates=/etc/prometheus/consoles"
  #     - "--storage.tsdb.retention.time=200h"
  #     - "--web.enable-admin-api"
  #     - "--web.enable-lifecycle"
  grafana:
    container_name: grafana
    image: grafana/grafana:11.6.15
    restart: always
    ports:
      - 3010:3000
    volumes:
      - ./grafana/data:/var/lib/grafana

volumes:
  influxdb-data:
    external: true
  mariadb-data:
    external: true

networks:
  homeapp73-docker_default:
    external: true
  villa73_default:
    external: true
