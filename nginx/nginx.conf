user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log notice;
pid        /var/run/nginx.pid;


events {
    worker_connections  1024;
}


http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    #tcp_nopush     on;

    keepalive_timeout  65;

    #gzip  on;

    server {
        listen       80;
        
        # Enable more detailed error logging
        error_log /var/log/nginx/error_detailed.log debug;
        
        # Add proxy headers for all locations
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Add timeout settings
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        
        location /api/cabinbookings/days {
            proxy_pass http://cabinbookings:3011/days;
        }
        location /api/electricity/current {
            proxy_pass http://electricity:3016/solar/current;
        }
        
        location /api/indoor/ {
            proxy_pass http://climateapi:5011/api/indoor/;
            # Add specific error logging for this location
            access_log /var/log/nginx/climate_access.log main;
            error_log /var/log/nginx/climate_error.log debug;
        }
                
        location /api {
            proxy_pass http://api:6001/api;
        }
        location / {
            proxy_pass http://homeapp73:3000;
        }
   }
}